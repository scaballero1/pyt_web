<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoliRestaurante - Sistema de Gestión</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos Personalizados PoliRestaurante -->
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-light py-4">

    <div class="container">
        <h1 class="text-center fw-bold mb-4">PoliRestaurante 🍽️</h1>

        <!-- SECCIÓN ADMINISTRADOR: REGISTRO -->
        <div class="row mb-4">
            <!-- Formulario Crear Producto -->
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        ➕ Agregar Producto al Menú
                    </div>
                    <div class="card-body">
                        <form id="form-producto" onsubmit="crearProducto(event)">
                            <div class="mb-2">
                                <label class="form-label small mb-1">Nombre del Producto</label>
                                <input type="text" id="prod-nombre" class="form-control" placeholder="Ej: Hamburguesa Especial" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small mb-1">Precio ($)</label>
                                <input type="number" step="0.01" id="prod-precio" class="form-control" placeholder="Ej: 15000" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small mb-1">Descripción</label>
                                <input type="text" id="prod-descripcion" class="form-control" placeholder="Ej: Carne 150g, queso y tocineta">
                            </div>
                            <div class="mb-2">
                                <label class="form-label small mb-1">ID de Categoría</label>
                                <input type="number" id="prod-categoria" class="form-control" placeholder="Ej: 1 (Opcional, por defecto 1)">
                            </div>
                            <button type="submit" class="btn btn-primary btn-sm w-100 mt-2">Guardar Producto</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Formulario Crear Mesa -->
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        🪑 Agregar Mesa
                    </div>
                    <div class="card-body">
                        <form id="form-mesa" onsubmit="crearMesa(event)">
                            <div class="mb-2">
                                <label class="form-label small mb-1">Número de Mesa</label>
                                <input type="number" id="mesa-numero" class="form-control" placeholder="Ej: 1" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small mb-1">Capacidad (personas)</label>
                                <input type="number" id="mesa-capacidad" class="form-control" placeholder="Ej: 4" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-sm w-100 mt-2">Guardar Mesa</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN ADMINISTRADOR: GESTIÓN DE USUARIOS (HU-01) -->
        <div class="row mb-4">
            <!-- Formulario Crear / Editar Usuario -->
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm border-0">
                    <div id="usuario-titulo" class="card-header bg-dark text-white fw-bold">
                        👥 Agregar Usuario
                    </div>
                    <div class="card-body">
                        <form id="form-usuario" onsubmit="guardarUsuario(event)">
                            <input type="hidden" id="usuario-id">
                            <div class="mb-2">
                                <label class="form-label small mb-1">Nombre</label>
                                <input type="text" id="usuario-nombre" class="form-control" placeholder="Ej: Ana Gómez" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small mb-1">Correo</label>
                                <input type="email" id="usuario-correo" class="form-control" placeholder="Ej: ana@restaurante.com" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small mb-1">Contraseña</label>
                                <input type="password" id="usuario-contrasena" class="form-control" placeholder="Contraseña" autocomplete="new-password" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small mb-1">Rol</label>
                                <select id="usuario-rol" class="form-select" required>
                                    <option value="mesero">Mesero</option>
                                    <option value="cocina">Cocina</option>
                                    <option value="admin">Administrador</option>
                                </select>
                            </div>
                            <button type="submit" id="usuario-guardar" class="btn btn-primary btn-sm w-100 mt-2">Guardar Usuario</button>
                            <button type="button" id="usuario-cancelar" class="btn btn-outline-secondary btn-sm w-100 mt-2 d-none" onclick="cancelarEdicionUsuario()">Cancelar edición</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Lista de Usuarios -->
            <div class="col-md-8 mb-3">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fs-6">Usuarios del Restaurante</h5>
                        <button onclick="cargarUsuarios()" class="btn btn-sm btn-light">Actualizar</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-sm align-middle mb-0">
                                <thead class="table-light">
                                    <tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th class="text-end">Acciones</th></tr>
                                </thead>
                                <tbody id="tabla-usuarios">
                                    <tr><td colspan="5" class="text-muted text-center py-3">Cargando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <hr class="my-4">

        <!-- SECCIÓN MESERO: CONSULTA DE DATOS -->
        <div class="row">
            <!-- Vista Menú -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fs-6">Menú del Restaurante</h5>
                        <button onclick="cargarMenu()" class="btn btn-sm btn-light">Actualizar</button>
                    </div>
                    <div class="card-body">
                        <ul id="lista-menu" class="list-group list-group-flush">
                            <li class="list-group-item text-muted text-center py-3">Haz clic en "Actualizar" o guarda un producto.</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Vista Mesas -->
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 fs-6">Estado de Mesas</h5>
                        <button onclick="cargarMesas()" class="btn btn-sm btn-light">Actualizar</button>
                    </div>
                    <div class="card-body">
                        <div id="grid-mesas" class="row g-2">
                            <div class="col-12 text-muted text-center py-3">Haz clic en "Actualizar" o guarda una mesa.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript Modular -->
    <script src="/static/app.js"></script>
</body>
</html>
